<div class="flex min-h-screen items-center justify-center bg-boutique-paper px-6">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <p class="text-xs uppercase tracking-widest text-boutique-mute">FICCT</p>
      <h1 class="font-display text-4xl text-boutique-ink">Boutique</h1>
      <p class="mt-2 text-sm text-boutique-mute">Panel administrativo</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="card space-y-4">
      <div>
        <label class="label" for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="input"
          autocomplete="username"
        />
        <p
          *ngIf="form.controls['email'].touched && form.controls['email'].invalid"
          class="mt-1 text-xs text-red-600"
        >
          Ingrese un correo electrónico válido.
        </p>
      </div>

      <div>
        <label class="label" for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="input"
          autocomplete="current-password"
        />
        <p
          *ngIf="form.controls['password'].touched && form.controls['password'].invalid"
          class="mt-1 text-xs text-red-600"
        >
          Mínimo 8 caracteres.
        </p>
      </div>

      <div *ngIf="error()" class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
        {{ error() }}
      </div>

      <button type="submit" class="btn-primary w-full" [disabled]="loading()">
        <span *ngIf="!loading()">Iniciar sesión</span>
        <span *ngIf="loading()">Iniciando…</span>
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-boutique-mute">
      Sistema integrado FICCT — versión 1.0.0
    </p>
  </div>
</div>
