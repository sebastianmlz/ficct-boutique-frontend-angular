<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2>Sucursales</h2>
    <button *ngIf="auth.hasRole('admin')" class="btn-primary" (click)="showForm.set(!showForm())">
      {{ showForm() ? 'Cerrar' : 'Nueva sucursal' }}
    </button>
  </div>

  <form *ngIf="showForm()" [formGroup]="form" (ngSubmit)="submit()" class="card grid gap-4 md:grid-cols-2">
    <div>
      <label class="label" for="code">Código</label>
      <input id="code" formControlName="code" class="input" />
    </div>
    <div>
      <label class="label" for="name">Nombre</label>
      <input id="name" formControlName="name" class="input" />
    </div>
    <div class="md:col-span-2">
      <label class="label" for="address">Dirección</label>
      <input id="address" formControlName="address" class="input" />
    </div>
    <div>
      <label class="label" for="latitude">Latitud</label>
      <input id="latitude" type="number" formControlName="latitude" class="input" step="any" />
    </div>
    <div>
      <label class="label" for="longitude">Longitud</label>
      <input id="longitude" type="number" formControlName="longitude" class="input" step="any" />
    </div>
    <div>
      <label class="label" for="phone">Teléfono</label>
      <input id="phone" formControlName="phone" class="input" />
    </div>
    <div class="flex items-end justify-end md:col-span-2">
      <button type="submit" class="btn-primary" [disabled]="saving()">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>

  <app-loading-state *ngIf="loading()" label="Cargando sucursales…" />
  <app-error-state *ngIf="error()" [message]="error()!" (retry)="load()" />

  <app-empty-state
    *ngIf="!loading() && !error() && branches().length === 0"
    icon="branches"
    title="Aún no hay sucursales"
    subtitle="Crea la primera sucursal para empezar."
  />

  <div *ngIf="branches().length > 0" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
    <div *ngFor="let b of branches(); trackBy: trackById" class="card">
      <div class="flex items-center justify-between">
        <h3 class="text-lg">{{ b.name }}</h3>
        <span class="badge badge-active">{{ b.code }}</span>
      </div>
      <p class="mt-2 flex items-center gap-1.5 text-sm text-boutique-mute">
        <app-icon name="location" [size]="14" /> {{ b.address }}
      </p>
      <p *ngIf="b.phone" class="mt-1 flex items-center gap-1.5 text-sm text-boutique-mute">
        <app-icon name="phone" [size]="14" /> {{ b.phone }}
      </p>
      <p *ngIf="b.latitude !== null && b.longitude !== null" class="mt-2 text-xs text-boutique-mute">
        {{ b.latitude }}, {{ b.longitude }}
      </p>
    </div>
  </div>
</div>
