<div class="max-w-3xl space-y-6">
  <div class="flex items-center justify-between">
    <h2>{{ editing() ? 'Editar producto' : 'Nuevo producto' }}</h2>
    <a routerLink="/products" class="btn-secondary">Volver</a>
  </div>

  <div *ngIf="loading()" class="card text-sm text-boutique-mute">Cargando producto…</div>

  <form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="submit()" class="card space-y-5">
    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label class="label" for="sku">SKU</label>
        <input id="sku" formControlName="sku" class="input" placeholder="ej. ABR-001" />
        <p *ngIf="editing()" class="mt-1 text-xs text-boutique-mute">El SKU no puede modificarse después de crear el producto.</p>
        <p *ngIf="!editing() && form.controls['sku'].touched && form.controls['sku'].invalid" class="mt-1 text-xs text-red-600">
          Mínimo 3 caracteres.
        </p>
      </div>
      <div>
        <label class="label" for="category">Categoría</label>
        <select id="category" formControlName="category" class="input">
          <option value="blusas">Blusas</option>
          <option value="pantalones">Pantalones</option>
          <option value="vestidos">Vestidos</option>
          <option value="faldas">Faldas</option>
        </select>
      </div>
    </div>

    <div>
      <label class="label" for="name">Nombre</label>
      <input id="name" formControlName="name" class="input" placeholder="Nombre que verá el cliente" />
    </div>

    <div>
      <label class="label" for="description">Descripción</label>
      <textarea
        id="description"
        formControlName="description"
        appAutosize
        class="input"
        placeholder="Material, ocasión, estilo, recomendaciones de uso…"
      ></textarea>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label class="label" for="basePrice">Precio base (BOB)</label>
        <input id="basePrice" type="number" formControlName="basePrice" class="input tabular-nums" min="0" step="0.01" />
      </div>
      <div>
        <label class="label" for="currency">Moneda</label>
        <select id="currency" formControlName="currency" class="input" [attr.disabled]="editing() ? '' : null">
          <option value="BOB">BOB · Bolivianos</option>
          <option value="USD">USD · Dólares</option>
        </select>
      </div>
    </div>

    <div *ngIf="editing()" class="flex items-center gap-3 rounded-md border border-boutique-line bg-stone-50 px-3 py-3">
      <input id="isActive" type="checkbox" formControlName="isActive" class="h-4 w-4" />
      <label for="isActive" class="text-sm">Producto activo (visible en catálogo de clientes)</label>
    </div>

    <app-image-upload
      [label]="editing() ? 'Reemplazar imagen' : 'Imagen del producto'"
      hint="JPG, PNG o WEBP. Máximo 5 MB. Idealmente cuadrada y ≥ 600 px."
      [existingUrl]="existingImageUrl()"
      (fileChosen)="onImageChosen($event)"
      (fileCleared)="onImageCleared()"
    ></app-image-upload>

    <div *ngIf="error()" class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
      {{ error() }}
    </div>

    <div *ngIf="uploading()" class="rounded-md border border-stone-200 bg-stone-50 px-3 py-2 text-sm text-boutique-mute">
      {{ uploadStage() || 'Procesando…' }}
    </div>

    <div class="flex justify-end gap-3">
      <a routerLink="/products" class="btn-secondary">Cancelar</a>
      <button type="submit" class="btn-primary" [disabled]="saving()">
        {{ saving() ? 'Guardando…' : (editing() ? 'Guardar cambios' : 'Guardar producto') }}
      </button>
    </div>
  </form>
</div>
