<div class="space-y-2">
  <p class="label">{{ label }}</p>

  <button
    type="button"
    class="relative flex w-full cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed bg-stone-50 p-6 text-left transition-colors focus:outline-none focus:ring-2 focus:ring-boutique-ink"
    [class.border-boutique-line]="!dragging() && !error()"
    [class.border-boutique-ink]="dragging() && !error()"
    [class.border-red-400]="!!error()"
    (click)="openPicker()"
    (keydown.enter)="openPicker()"
    (keydown.space)="$event.preventDefault(); openPicker()"
  >
    <input #fileInput type="file" accept="image/jpeg,image/png,image/webp" class="hidden" (change)="onFileChange($event)" />

    <ng-container *ngIf="preview(); else placeholder">
      <img [src]="preview()" alt="Vista previa" class="mb-3 max-h-44 rounded-md object-contain" />
      <div class="text-center">
        <p class="text-sm font-medium text-boutique-ink">{{ chosen()?.name }}</p>
        <p class="text-xs text-boutique-mute">{{ chosen()?.sizeKb }} KB · {{ chosen()?.type }}</p>
      </div>
      <div class="mt-3 flex gap-2">
        <button type="button" class="btn-secondary" (click)="$event.stopPropagation(); openPicker()">Cambiar</button>
        <button type="button" class="btn-secondary" (click)="$event.stopPropagation(); clear()">Quitar</button>
      </div>
    </ng-container>

    <ng-template #placeholder>
      <ng-container *ngIf="existingUrl; else empty">
        <img [src]="existingUrl" alt="Imagen actual" class="mb-3 max-h-40 rounded-md object-contain" />
        <p class="text-xs text-boutique-mute">Imagen actual. Toque para reemplazar.</p>
      </ng-container>
      <ng-template #empty>
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white text-boutique-mute">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-6 w-6">
            <path d="M3 16.5V7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5Z" />
            <circle cx="9" cy="10" r="1.5" />
            <path d="m21 16-5-5-8 8" />
          </svg>
        </div>
        <p class="mt-3 text-sm font-medium text-boutique-ink">Arrastra una imagen aquí o haz clic para elegir</p>
        <p class="mt-1 text-xs text-boutique-mute">{{ hint }}</p>
      </ng-template>
    </ng-template>
  </button>

  <p *ngIf="error()" class="text-xs text-red-600">{{ error() }}</p>
</div>
